name: Build verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Chess
        uses: actions/checkout@v4

      # The chess engine lives in-tree under codes.castled.chess.engine, so there is no
      # external engine to check out or install. Gradle caching is handled by setup-gradle.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build and verify
        run: gradle clean build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Chess-${{ github.sha }}
          path: build/libs/Chess.jar
          if-no-files-found: error
