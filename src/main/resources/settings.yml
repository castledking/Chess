# General settings for the Chess plugin.

# Chess duel request settings.
duel-request:
  # A duel request expires after this many seconds.
  duel-request-expires-in-seconds: 60

# Game settings.
chess-game:
  # Sounds played at the given events. Use 'no.sound' to disable one.
  sounds:
    move: 'block.anvil.break'
    check: 'block.chain.fall'
    win: 'entity.player.levelup'
    loss: 'block.beacon.deactivate'
    draw: 'event.raid.horn'

  draw:
    # Players can send a new draw offer after this many seconds.
    offer-cooldown-in-seconds: 60
    # A sent draw offer expires after this many seconds.
    offer-expires-in-seconds: 30

  surrender:
    # A surrender confirmation expires after this many seconds.
    offer-expires-in-seconds: 5

# Dialog board appearance and behaviour.
ui:
  dialog:
    # Dialog title (MiniMessage).
    title: '<gold>Chess</gold>'
    # Whether pressing ESC closes the board (never resigns).
    allow-escape-close: true
    # If true each player sees the board from their own colour's side.
    orientation-follows-player: true
    show-coordinates: true
    show-legal-moves: true
    show-last-move: true
    show-captured-pieces: true
    show-clock: true
    # Minimum ticks between clock-driven redraws (>= 20).
    clock-refresh-ticks: 20
    # Render resource-pack piece glyphs (vs Unicode chess symbols when false).
    use-glyphs: true
    # Width of each of the 64 board buttons in the 8x8 grid. Resign/Draw/Flip are rendered as
    # clickable body text above the board, so the grid stays exactly 64 uniform cells.
    # The bundled pack uses 22px board tiles whose negative font advances keep their measured
    # labels within this 20px button. Changing this width without regenerating the tile geometry
    # can reintroduce grid seams or Minecraft's overflowing-label marquee.
    square-button-width: 20

# Resource pack delivery.
resource-pack:
  # Master switch. true: the plugin manages the pack (registers it with ResourcePackManager if
  # installed, otherwise sends it directly via the url below). false: the plugin does NOTHING —
  # it neither sends nor merges the pack, so you can manage it yourself (e.g. remove it from
  # ResourcePackManager) while keeping the plugin installed. The pack file is still written to
  # plugins/Chess/resourcepack.zip either way.
  use-resourcepack: true
  # Direct-send URL, used ONLY when ResourcePackManager is NOT installed. Host the exact file at
  # plugins/Chess/resourcepack.zip somewhere and point this at it; the SHA-1 is computed
  # automatically. Leave blank to send nothing directly.
  url: ''

# Easter eggs. Off by default; these are not standard chess rules.
easter-egg:
  # Vertical castling (the Pam-Krabbe castling). When a pawn promotes to a rook on the king's
  # own file, that rook has never moved, so the king may castle with it straight up the board:
  # the king moves two squares towards it and the rook lands on the square the king crossed
  # (e.g. white Ke1 with a promoted rook on e8 becomes Ke3, Re2). All the normal castling
  # restrictions still apply — the king must not have moved, the file between them must be
  # empty, and the king may not castle out of, through, or into check.
  enable-vertical-castling: false
